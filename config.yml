# Blocky DNS Server Configuration
# Blocks gambling websites using custom blocklist

# Upstream DNS servers (where to forward allowed queries)
upstream:
  default:
    - 1.1.1.1  # Cloudflare
    - 8.8.8.8  # Google DNS

# Blocklist configuration
blocking:
  denylists:
    gambling:
      # 1) Blocklist Project gambling — broad community list (largest coverage).
      - https://raw.githubusercontent.com/blocklistproject/Lists/master/gambling.txt

      # 2) YOUR custom gambling blocklist (edit gambling-blocklist.txt)
      - https://raw.githubusercontent.com/dwhale000/checkpoint-dns-server/main/gambling-blocklist.txt

      # TO UPDATE YOUR LIST:
      # 1. Edit gambling-blocklist.txt locally
      # 2. Commit and push the update
      # 3. Wait for Blocky to refresh it automatically

  # Apply gambling blocklist to ALL clients
  clientGroupsBlock:
    default:
      - gambling

  # What to return for blocked domains
  blockType: zeroIp  # Returns 0.0.0.0 for IPv4, :: for IPv6

  # Enable blocking
  loading:
    # How often to refresh the blocklist
    refreshPeriod: 1h
    downloads:
      timeout: 60s
      attempts: 5
      cooldown: 10s

# Ports configuration
ports:
  dns: 53      # Standard DNS port
  http: 8080   # HTTP port for DoH
  https: 443   # HTTPS port for DoH (DNS-over-HTTPS)
  dohPath: /dns-query

# Logging
log:
  level: info
  format: text
  timestamp: true

# Enable query logging - shows BLOCKED queries
queryLog:
  type: console
  target: stdout
  logRetentionDays: 0
  fields:
    - clientIP
    - clientName
    - responseReason
    - responseAnswer
    - question
    - duration

# Enable prometheus metrics (optional)
prometheus:
  enable: false

# Bootstrap DNS (used for external lookups such as upstream resolvers)
bootstrapDns: tcp+udp:1.1.1.1
